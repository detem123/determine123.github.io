name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # 改用稳定的 Node.js 18
          # 暂时禁用缓存以排除干扰
          # cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install  # 去掉了 --frozen-lockfile 以自动修复一些 lock 文件问题

      - name: 构建站点
        run: pnpm build

      - name: 部署到 gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/.vuepress/dist
          publish_branch: gh-pages
          force_orphan: true
